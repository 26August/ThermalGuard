name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.2.0 (leave empty to use module.prop)'
        required: false
        default: ''
      version:
        description: 'Force version in module.prop, e.g. v1.2.0 (empty = follow tag / module.prop)'
        required: false
        default: ''
      versionCode:
        description: 'Force versionCode, e.g. 10200 (empty = follow module.prop, or auto-bump if tag bumps version)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
      issues:
        description: 'Issues list, comma-separated, e.g. Samsung A05s bootloop,UI shows NO DATA'
        required: false
        default: ''
      fixes:
        description: 'Fixes list, semicolon-separated in same order as issues. E.g. no sysfs in post-fs-data;fix ksu.exec protocol'
        required: false
        default: ''
      highlights:
        description: 'Short release highlight (top of release body)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail
          RAW_PROP_VER=$(sed -n 's/^version=//p' module.prop | tr -d '\r' | head -1)
          RAW_PROP_CODE=$(sed -n 's/^versionCode=//p' module.prop | tr -d '\r' | head -1)
          INPUT_TAG="${{ github.event.inputs.tag }}"
          INPUT_VER="${{ github.event.inputs.version }}"
          INPUT_CODE="${{ github.event.inputs.versionCode }}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_VER}" ]; then
            TAG="${INPUT_VER}"
          else
            TAG="${RAW_PROP_VER}"
          fi
          case "$TAG" in v*) ;; *) TAG="v${TAG}" ;; esac

          if [ -n "${INPUT_VER}" ]; then
            VERSION="${INPUT_VER}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG}" ]; then
            VERSION="${INPUT_TAG}"
          else
            VERSION="${TAG}"
          fi
          case "$VERSION" in v*) ;; *) VERSION="v${VERSION}" ;; esac

          if [ -n "${INPUT_CODE}" ]; then
            VERSION_CODE="${INPUT_CODE}"
          elif [ "${VERSION}" != "${RAW_PROP_VER}" ] && [ -n "${RAW_PROP_CODE}" ]; then
            NUM="${VERSION#v}"; NUM="${NUM%%-*}"
            IFS=. read -r _MA _MI _PA <<< "${NUM}"
            _MA=${_MA:-1}; _MI=${_MI:-0}; _PA=${_PA:-0}
            CALC=$(( _MA * 10000 + _MI * 100 + _PA ))
            if [ "${CALC}" -gt "${RAW_PROP_CODE}" ]; then
              VERSION_CODE="${CALC}"
            else
              VERSION_CODE=$(( RAW_PROP_CODE + 1 ))
            fi
          else
            VERSION_CODE="${RAW_PROP_CODE}"
          fi

          echo "tag=${TAG}"            >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"    >> "$GITHUB_OUTPUT"
          echo "versionCode=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "raw_prop_version=${RAW_PROP_VER}" >> "$GITHUB_OUTPUT"
          echo "raw_prop_code=${RAW_PROP_CODE}"   >> "$GITHUB_OUTPUT"

          echo "Tag: ${TAG}"
          echo "Version: ${VERSION}"
          echo "VersionCode: ${VERSION_CODE}"

      # ── Build conditions-fixed summary (from dispatch inputs) ─────────
      # `issues`  = issues separated by comma or newline
      # `fixes`   = fixes separated by ;  (order must match `issues`)
      - name: Build conditions and fixes
        id: cond
        run: |
          set -euo pipefail
          ISSUES_RAW="${{ github.event.inputs.issues }}"
          FIXES_RAW="${{ github.event.inputs.fixes }}"
          HIGHLIGHTS="${{ github.event.inputs.highlights }}"

          # Normalize separators: allow "," or newline
          ISSUES_CSV=$(printf '%s' "${ISSUES_RAW}" | tr '\n' ',' )
          FIXES_CSV=$(printf '%s' "${FIXES_RAW}"  | tr '\n' ';')

          python3 << PY
          import os, re, html
          def split_issues(s):
              parts = re.split(r'\s*,\s*', s.strip())
              return [p.strip() for p in parts if p.strip()]
          def split_fixes(s):
              if not s.strip():
                  return []
              s = s.replace('\r','').replace('\n',';').replace(',', ';')
              parts = [p.strip() for p in s.split(';')]
              return [p for p in parts if p]

          issues = split_issues(os.environ.get("ISSUES_CSV",""))
          fixes = split_fixes(os.environ.get("FIXES_CSV",""))

          out_dir = "/tmp"
          body = []
          body.append("## ThermalGuard v1 review")  # placeholder overwritten later with real tag
          # Build markdown table if provided
          if issues or fixes:
              body.append("")
              body.append("| # | Issue / Condition | Status | Fix / Notes |")
              body.append("|---|---|---|---|")
              for i, issue in enumerate(issues):
                  fix = fixes[i] if i < len(fixes) else ""
                  if not fix.strip():
                      status = "Open"
                      fix_col = "—"
                  else:
                      low = fix.lower()
                      if any(k in low for k in ["fixed","fix","done","ok","resolved","closed","completed"]):
                          status = "Fixed"
                      else:
                          status = "In progress"
                      fix_col = fix
                  body.append(f"| {i+1} | {issue} | {status} | {fix_col} |")
              body.append("")
              if len(fixes) < len(issues) and any(not f.strip() for f in fixes + [""]*max(0, len(issues)-len(fixes))):
                  body.append("> Fill the `fixes` field per row to mark a status as **Fixed**. Format: `fixes` separated by `;` in the same order as `issues`.")
                  body.append("")

          # Also produce env file style for zip
          env_path = "/tmp/conditions.env"
          with open(env_path, "w", encoding="utf-8") as f:
              f.write(f"COUNT={len(issues)}\n")
              for i, issue in enumerate(issues):
                  fix = fixes[i] if i < len(fixes) else ""
                  esc = lambda s: s.replace("\\","\\\\").replace('"','\\"')
                  f.write(f'ISSUE_{i+1}="{esc(issue)}"\n')
                  f.write(f'FIX_{i+1}="{esc(fix)}"\n')

          md_path = "/tmp/conditions.md"
          with open(md_path, "w", encoding="utf-8") as f:
              f.write("\n".join(body))

          print(f"conditions table: {len(issues)} issue(s), {len([x for x in fixes if x.strip()])} fix(es)")
          for i, issue in enumerate(issues):
              print(f"  {i+1}. {issue!r} -> {fixes[i] if i<len(fixes) else ''!r}")
          PY

          echo "--- /tmp/conditions.md ---"
          cat /tmp/conditions.md 2>/dev/null || true
          echo "--- /tmp/conditions.env ---"
          cat /tmp/conditions.env 2>/dev/null || true

          # Make path available to next steps
          echo "md=/tmp/conditions.md"   >> "$GITHUB_OUTPUT"
          echo "env=/tmp/conditions.env" >> "$GITHUB_OUTPUT"
          echo "is_manual=${{ github.event_name == 'workflow_dispatch' }}" >> "$GITHUB_OUTPUT"
        env:
          ISSUES_CSV: ${{ github.event.inputs.issues }}
          FIXES_CSV: ${{ github.event.inputs.fixes }}

      - name: Prepare changelog (auto)
        id: log
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "${PREV}" ]; then
            git log --oneline -20 --no-merges > /tmp/commits.txt || echo "(no history)" > /tmp/commits.txt
          else
            git log "${PREV}..HEAD" --oneline --no-merges > /tmp/commits.txt || git log --oneline -20 --no-merges > /tmp/commits.txt
          fi
          echo "Changelog ${PREV}..HEAD:"
          cat /tmp/commits.txt
          {
            echo "commits<<EOF"
            cat /tmp/commits.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Patch version in staged files
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          VERSION_CODE="${{ steps.ver.outputs.versionCode }}"

          if grep -q '^version=' module.prop; then
            sed -i "s/^version=.*/version=${VERSION}/" module.prop
          else
            echo "version=${VERSION}" >> module.prop
          fi
          if grep -q '^versionCode=' module.prop; then
            sed -i "s/^versionCode=.*/versionCode=${VERSION_CODE}/" module.prop
          else
            echo "versionCode=${VERSION_CODE}" >> module.prop
          fi
          echo "Patched module.prop:"
          cat module.prop

      - name: Stage module files
        run: |
          set -euo pipefail
          STAGE="${RUNNER_TEMP}/stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"

          cp module.prop customize.sh post-fs-data.sh service.sh sepolicy.rule \
             LICENSE README.md "$STAGE/"
          cp -a bin config soc webroot "$STAGE/"
          # Include conditions report inside zip (user can open after flashing)
          mkdir -p "$STAGE/docs"
          cp /tmp/conditions.env "$STAGE/docs/RELEASE_FIXES.env" 2>/dev/null || true
          if [ -f /tmp/conditions.md ]; then
            sed "s/## ThermalGuard v1 review/## ThermalGuard ${{ steps.ver.outputs.tag }}/" \
              /tmp/conditions.md > "$STAGE/docs/RELEASE_NOTES.md" 2>/dev/null || cp /tmp/conditions.md "$STAGE/docs/RELEASE_NOTES.md"
          fi

          META="$STAGE/META-INF/com/google/android"
          mkdir -p "$META"
          if [ -f ".github/release/META-INF/com/google/android/update-binary" ]; then
            cp .github/release/META-INF/com/google/android/update-binary "$META/"
            cp .github/release/META-INF/com/google/android/updater-script "$META/"
            echo "META-INF: vendored stub"
          else
            echo '#MAGISK' > "$META/updater-script"
            printf '#!/sbin/sh\nexit 0\n' > "$META/update-binary"
            echo "META-INF: generated stub"
          fi
          chmod 755 "$META/update-binary" 2>/dev/null || true

          if curl -fsSL --connect-timeout 8 --max-time 20 \
              -o "${RUNNER_TEMP}/magisk_installer.sh" \
              https://raw.githubusercontent.com/topjohnwu/Magisk/master/scripts/module_installer.sh 2>/dev/null \
              && [ -s "${RUNNER_TEMP}/magisk_installer.sh" ]; then
            cp "${RUNNER_TEMP}/magisk_installer.sh" "$META/update-binary"
            chmod 755 "$META/update-binary"
            echo "META-INF: official Magisk installer (downloaded)"
          else
            echo "META-INF: using vendored stub"
          fi

          find "$STAGE" -name '*.zip' -delete

          echo "Staged tree:"
          find "$STAGE" -type f | sort
          echo "Staged module.prop:"
          cat "$STAGE/module.prop"

      - name: Create zip
        id: zip
        run: |
          set -euo pipefail
          ZIP_NAME="ThermalGuard-${{ steps.ver.outputs.tag }}.zip"
          OUT="${GITHUB_WORKSPACE}/${ZIP_NAME}"
          (cd "${RUNNER_TEMP}/stage" && zip -r -9 "$OUT" .)
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "===== unzip -l ====="
          unzip -l "$OUT"

      - name: Verify zip structure
        run: |
          set -euo pipefail
          LIST=$(unzip -Z1 "${{ steps.zip.outputs.zip_name }}" | sed 's|^\./||')

          printf '%s\n' "$LIST" | grep -qx 'module.prop' \
            || { echo "::error::module.prop is missing at zip root"; printf '%s\n' "$LIST"; exit 1; }
          if printf '%s\n' "$LIST" | grep -Ei '\.zip$'; then
            echo "::error::Nested zip found inside the package"; exit 1
          fi
          for f in customize.sh service.sh post-fs-data.sh; do
            printf '%s\n' "$LIST" | grep -qx "$f" \
              || { echo "::error::Required file is missing: $f"; exit 1; }
          done
          echo "Zip structure OK"

      - name: Build release body
        id: body
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          HIGHLIGHTS="${{ github.event.inputs.highlights }}"
          CONDITIONS="/tmp/conditions.md"
          RAW_COMMITS="/tmp/commits.txt"

          HIGH_MD=""
          if [ -n "${HIGHLIGHTS}" ]; then
            HIGH_MD="> ${HIGHLIGHTS}"
          fi

          COND_MD=""
          if [ -f "${CONDITIONS}" ] && [ -s "${CONDITIONS}" ]; then
            COND_MD=$(sed "s/^## ThermalGuard v1 review/## ThermalGuard ${TAG}/" "${CONDITIONS}" 2>/dev/null || cat "${CONDITIONS}")
          else
            COND_MD="_No conditions recorded for this release._"
          fi

          COMMIT_MD=""
          if [ -f "${RAW_COMMITS}" ] && [ -s "${RAW_COMMITS}" ]; then
            COMMIT_MD=$(python3 - << 'PY'
          import pathlib
          lines = pathlib.Path("/tmp/commits.txt").read_text(encoding="utf-8", errors="replace").splitlines()
          out = []
          for l in lines[:25]:
              l = l.strip()
              if not l: continue
              out.append(f"- {l}")
          if len(lines) > 25:
              out.append(f"- ... ({len(lines)-25} more)")
          print("\n".join(out))
          PY
          )
          else
            COMMIT_MD="(no commits)"
          fi

          cat > /tmp/release_body.md << EOF
          ## ThermalGuard ${TAG}

          ${HIGH_MD}

          ### Installation
          1. Download \`${{ steps.zip.outputs.zip_name }}\`
          2. Flash via Magisk / KernelSU / APatch
          3. Reboot

          ### Version
          - \`version\`: \`${{ steps.ver.outputs.version }}\`
          - \`versionCode\`: \`${{ steps.ver.outputs.versionCode }}\`
          - From workflow inputs \`version\`/\`versionCode\` (or tag).

          ### Issues and Fixes

          ${COND_MD}

          ### Changes

          ${COMMIT_MD}

          ### Safety
          - Hard limits: CPU/GPU die 85°C, battery 48°C
          - Fail-safe restores stock values; module locks for 5 minutes after Critical
          EOF

          echo "===== release body ====="
          cat /tmp/release_body.md

          {
            echo "body<<EOF"
            cat /tmp/release_body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Checksum
        id: sum
        run: |
          set -euo pipefail
          ZIP_NAME="${{ steps.zip.outputs.zip_name }}"
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          cat "${ZIP_NAME}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ThermalGuard ${{ steps.ver.outputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.zip.outputs.zip_name }}
            ${{ steps.zip.outputs.zip_name }}.sha256
          body: ${{ steps.body.outputs.body }}
